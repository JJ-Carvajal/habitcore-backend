<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HabitCore - Registro</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Pequeño ajuste para que el mensaje de error no mueva los elementos de forma brusca */
        .password-msg {
            color: #ffb8b8;
            font-size: 0.8rem;
            margin-top: -12px;
            margin-bottom: 12px;
            padding-left: 5px;
            display: none; /* Se activa con JS */
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <!-- IZQUIERDA: Formulario -->
    <div class="auth-container">
        <h2>HabitCore</h2>
        <p class="subtitle" style="margin-bottom: 25px;">Crea tu cuenta y empieza a construir hábitos</p>

        <form id="form-registro">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="nombre" placeholder="Nombre de usuario" required minlength="3">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-group input-group-password">
                <i class="fa-solid fa-lock"></i>
                <!-- El ID 'password' es clave para el JS -->
                <input type="password" id="password" placeholder="Contraseña segura" required>
                <button type="button" class="toggle-password" id="toggle-password-registro" aria-label="Mostrar contraseña">
                    <i class="fa-solid fa-eye" id="eye-icon"></i>
                </button>
            </div>
            
            <!-- Contenedor dinámico para avisos de seguridad -->
            <p id="password-msg" class="password-msg"></p>

            <button type="submit" id="btn-registro">Registrarse</button>
        </form>

        <div class="auth-link">
            ¿Ya tienes cuenta?
            <a href="login.html">Iniciar sesión</a>
        </div>
    </div>

    <!-- DERECHA: Imagen y Hero Text -->
    <div class="logo-side">
        <div class="logo-content">
            <img src="../assets/logo.png" alt="HabitCore Logo">
            <h1 class="hero-text">
                Construye disciplina.
                <span>Domina tu día.</span>
            </h1>
            <p class="hero-sub">
                Pequeños hábitos diarios crean resultados extraordinarios.
            </p>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
